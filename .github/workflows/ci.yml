name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check orphaned modules
        run: ./ci/check-orphans.sh

      - name: Clippy (errors only)
        # Warnings are still reported but do not fail the build for v0.3.0.
        # Tighten to -D warnings in v0.4 after cleanup pass.
        run: cargo clippy --all-targets

      - name: Build release binary
        run: cargo build --release --bin envelope

      - name: Test all crates
        run: cargo test --all

  linux-smoke:
    name: Linux smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-smoke-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-smoke-cargo-

      - name: Build release binary
        run: cargo build --release --bin envelope

      - name: Smoke — version flag exits 0
        run: ./target/release/envelope --version

      - name: Smoke — quickstart --skip-network exits 2 (no account configured)
        # Exit code 2 = PhaseName::Account failure — the expected outcome on a
        # bare CI runner with no Envelope config directory or database.
        # The paths phase (exit 1) runs first but succeeds because HOME is set.
        # --skip-network suppresses the IMAP phases so we never reach exit 3/4.
        run: |
          # `|| STATUS=$?` exempts the command from `set -e` so the expected
          # non-zero exit is captured instead of aborting the step.
          STATUS=0
          ./target/release/envelope quickstart --skip-network --json || STATUS=$?
          if [ "$STATUS" -ne 2 ]; then
            echo "Expected exit code 2 (no_account_configured), got $STATUS" >&2
            exit 1
          fi
          echo "Got expected exit code 2"

  web:
    name: Web frontend (SPA bundle drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/dashboard/web/package-lock.json

      - name: Install dependencies
        working-directory: crates/dashboard/web
        run: npm ci

      - name: Run tests
        working-directory: crates/dashboard/web
        run: npm test

      - name: Build SPA bundle
        working-directory: crates/dashboard/web
        run: npm run build

      - name: Verify committed bundle matches sources
        # The bundle is embedded via rust-embed and must be committed.
        # A dirty tree here means someone rebuilt without committing the output.
        # We check both modified tracked files and new untracked files under build/.
        run: |
          if ! git diff --quiet -- crates/dashboard/web/build \
             || [[ -n "$(git ls-files --others --exclude-standard -- crates/dashboard/web/build)" ]]; then
            echo "ERROR: crates/dashboard/web/build/ is out of date after building." >&2
            echo "       The committed SPA bundle does not match the sources." >&2
            echo "       Rebuild and commit:" >&2
            echo "         cd crates/dashboard/web && npm run build" >&2
            echo "         git add crates/dashboard/web/build && git commit" >&2
            echo "" >&2
            echo "Changed/new files:" >&2
            git status --porcelain -- crates/dashboard/web/build >&2
            exit 1
          fi
          echo "OK: committed bundle matches sources."

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color /github/workspace/.github/workflows/ci.yml /github/workspace/.github/workflows/release.yml

  security-grep:
    name: Governor architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy Governor adapters and bypasses
        run: |
          set -e
          FORBIDDEN='governor::|GovernorAttrs|--no-governor|GOVERNOR_PATH|governor envelope send|--attr user_requested'
          if grep -rnE -- "$FORBIDDEN" crates/ 2>/dev/null; then
            echo "ERROR: legacy Governor adapter or bypass identifiers found above" >&2
            exit 1
          fi
          grep -rn "score --catalog envelope" crates/ >/dev/null
          echo "Clean."
