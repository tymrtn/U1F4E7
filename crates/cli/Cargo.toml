[package]
name = "envelope-email"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "BYO mailbox email client with agent-native primitives"

[features]
# Build the Governor send gate into the `envelope` binary:
#   cargo build --release --bin envelope --features governor
#   cargo install --path crates/cli --features governor
governor = [
    "envelope-email-transport/governor",
    "envelope-email-dashboard/governor",
]

[[bin]]
name = "envelope"
path = "src/main.rs"

[dependencies]
envelope-email-store = { path = "../store" }
envelope-email-transport = { path = "../email" }
envelope-email-dashboard = { path = "../dashboard" }

mail-builder.workspace = true
clap.workspace = true
tokio.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
reqwest.workspace = true
url.workspace = true
futures-util.workspace = true
async-imap.workspace = true
hickory-resolver.workspace = true
lettre.workspace = true
mime_guess = "2"
base64.workspace = true
rpassword.workspace = true
wait-timeout.workspace = true

[dev-dependencies]
tempfile = "3"
rusqlite.workspace = true
envelope-email-transport = { path = "../email", features = ["test-support"] }
