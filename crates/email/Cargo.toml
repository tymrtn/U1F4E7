[package]
name = "envelope-email-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "IMAP/SMTP transport, auto-discovery, and MIME building for Envelope Email"

[features]
# Build the Governor send gate into every SMTP-capable path. Off by default:
# without it, SMTP sends are not scored by Governor. This is a build-time choice
# so no environment variable, CLI flag, or config key can change it at runtime.
governor = []

[dependencies]
envelope-email-store = { path = "../store" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
libc = "0.2"

# IMAP/SMTP
async-imap.workspace = true
imap-proto.workspace = true
lettre.workspace = true
mail-parser.workspace = true
mail-builder.workspace = true

# Code extraction
regex = "1"

# Header encoding
base64.workspace = true

# Backup archive checksums
sha2.workspace = true

# DOCX (ZIP container) attachment text extraction for evidence export
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP client (List-Unsubscribe)
reqwest.workspace = true

# URL parsing (SSRF guard for webhook targets)
url.workspace = true

# DNS discovery
hickory-resolver.workspace = true

# TLS
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
futures-util.workspace = true
ammonia = "4.2.0"
idna = "1"

[dev-dependencies]
tempfile = "3"
