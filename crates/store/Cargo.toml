[package]
name = "envelope-email-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "SQLite persistence, credential encryption, and config store for Envelope Email"

[features]
default = ["keychain"]
keychain = ["dep:keyring"]

[dependencies]
rusqlite.workspace = true
rusqlite_migration = "1.3"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# The address validator lettre uses at the SMTP edge (`lettre::Address` calls
# `EmailAddress::is_valid_local_part` / `is_valid_domain`). Reused here so the
# address book can never suggest a recipient the send path would refuse.
email_address = "0.2"

# Crypto
aes-gcm.workspace = true
argon2.workspace = true
sha2.workspace = true
rand.workspace = true
base64.workspace = true

# OS keychain (optional — needed for --credential-store keychain).
# Base declaration: optional, no platform features here.
# Platform features are layered in via [target.'cfg(...)'.dependencies] below.
keyring = { version = "3", optional = true }
dirs-next.workspace = true

# Machine identity for file-based credential store
hostname = "0.4"
whoami = "1"

[dev-dependencies]
tempfile = "3"

# macOS: use the native Keychain API
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }

# Linux: async-secret-service uses zbus (pure-Rust D-Bus — no system libdbus link).
# crypto-rust avoids OpenSSL. tokio feature matches our async runtime.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"], optional = true }
