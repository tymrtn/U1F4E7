[build]
publish = "."

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/repo"
to = "https://github.com/tymrtn/U1F4E7"
status = 302

[[redirects]]
from = "/github"
to = "https://github.com/tymrtn/U1F4E7"
status = 302
