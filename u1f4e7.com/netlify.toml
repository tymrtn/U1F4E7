[build]
publish = "."

# The homepage is the distribution surface for new Envelope releases. Keep the
# browser and Netlify Edge revalidating it so a release-page link cannot sit
# behind an old root document after a production deploy.
[[headers]]
for = "/"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/repo"
to = "https://github.com/tymrtn/U1F4E7"
status = 302

[[redirects]]
from = "/github"
to = "https://github.com/tymrtn/U1F4E7"
status = 302

# The pricing section lives on the homepage.
[[redirects]]
from = "/pricing"
to = "/#pricing"
status = 301

# `curl -fsSL https://u1f4e7.com/install.sh | bash` follows this to the
# installer at the root of the product repo's main branch.
[[redirects]]
from = "/install.sh"
to = "https://raw.githubusercontent.com/tymrtn/U1F4E7/main/install.sh"
status = 302
